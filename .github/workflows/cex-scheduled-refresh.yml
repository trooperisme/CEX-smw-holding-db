name: CEX scheduled refresh

on:
  schedule:
    # UTC: 02:17 and 06:47 GMT+7. A backup retries a missed or incomplete daily scan.
    - cron: "17 19 * * *"
    - cron: "47 23 * * *"
  workflow_dispatch:
    inputs:
      sync_registry_only:
        description: Sync the tracked trader registry without starting a scrape
        type: boolean
        required: false
        default: false
      resume_signal_snapshot_id:
        description: Retry only failed traders in an existing signal snapshot
        type: string
        required: false
        default: ""

concurrency:
  group: ${{ inputs.sync_registry_only && 'cex-registry-sync' || 'cex-scheduled-refresh' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh signals, spot holdings, and order intent
    runs-on: ubuntu-latest
    # A full scan can approach 60 minutes when the upstream source is slow.
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build scheduler
        run: npm run build

      - name: Sync tracked trader registry
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REQUIRE_SUPABASE_STORAGE: "1"
        run: npm run signals:registry:sync

      - name: Check today's completed snapshot
        id: daily_guard
        if: github.event_name == 'schedule'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run signals:scheduled:guard

      - name: Resume failed traders in an existing snapshot
        if: ${{ inputs.resume_signal_snapshot_id != '' }}
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REQUIRE_SUPABASE_STORAGE: "1"
          SIGNALS_REFRESH_CONCURRENCY: "2"
          FIRECRAWL_MIN_INTERVAL_MS: ${{ vars.FIRECRAWL_MIN_INTERVAL_MS || '10000' }}
          HYPURRSCAN_SCRAPE_RETRY_COUNT: "2"
          RESUME_SIGNAL_SNAPSHOT_ID: ${{ inputs.resume_signal_snapshot_id }}
        run: npm run signals:recover -- "$RESUME_SIGNAL_SNAPSHOT_ID"

      - name: Run scheduled refresh
        if: ${{ !inputs.sync_registry_only && inputs.resume_signal_snapshot_id == '' && (github.event_name != 'schedule' || steps.daily_guard.outputs.should_run == 'true') }}
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REQUIRE_SUPABASE_STORAGE: "1"
          SIGNALS_REFRESH_CONCURRENCY: ${{ vars.SIGNALS_REFRESH_CONCURRENCY || '4' }}
          FIRECRAWL_MIN_INTERVAL_MS: ${{ vars.FIRECRAWL_MIN_INTERVAL_MS || '10000' }}
          HYPURRSCAN_SCRAPE_RETRY_COUNT: "2"
          SPOT_HOLDING_CONCURRENCY: ${{ vars.SPOT_HOLDING_CONCURRENCY || '4' }}
          SPOT_HOLDING_MIN_USD: ${{ vars.SPOT_HOLDING_MIN_USD || '333' }}
          SPOT_HOLDING_CACHE_TTL_HOURS: ${{ vars.SPOT_HOLDING_CACHE_TTL_HOURS || '6' }}
          HYPERLIQUID_OPEN_ORDERS_CONCURRENCY: ${{ vars.HYPERLIQUID_OPEN_ORDERS_CONCURRENCY || '6' }}
          HYPERLIQUID_OPEN_ORDERS_MIN_INTERVAL_MS: ${{ vars.HYPERLIQUID_OPEN_ORDERS_MIN_INTERVAL_MS || '1500' }}
        run: npm run signals:scheduled
