name: CEX scheduled refresh

on:
  schedule:
    # GitHub Actions uses UTC. 01:00 UTC is 08:00 GMT+7.
    - cron: "0 1 * * *"
  workflow_dispatch:

concurrency:
  group: cex-scheduled-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh signals and spot holdings
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build scheduler
        run: npm run build

      - name: Run scheduled refresh
        env:
          APP_USERNAME: ${{ secrets.APP_USERNAME }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAIN_APP_URL: ${{ secrets.MAIN_APP_URL }}
          SIGNALS_REFRESH_CONCURRENCY: ${{ vars.SIGNALS_REFRESH_CONCURRENCY || '4' }}
          SPOT_HOLDING_CONCURRENCY: ${{ vars.SPOT_HOLDING_CONCURRENCY || '4' }}
          SPOT_HOLDING_MIN_USD: ${{ vars.SPOT_HOLDING_MIN_USD || '333' }}
          SPOT_HOLDING_CACHE_TTL_HOURS: ${{ vars.SPOT_HOLDING_CACHE_TTL_HOURS || '6' }}
        run: npm run signals:scheduled
